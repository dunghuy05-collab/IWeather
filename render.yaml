services:
  - type: web
    name: wandermind
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend && npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wandermind-db
          property: connectionString
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: FUEL_PRICE_PER_LITER_VND
        value: "24000"

databases:
  - name: wandermind-db
    plan: free
    region: singapore
    databaseName: wandermind
    user: wandermind
